<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>こえで もじ テスト</title>
<style>
:root{--bg:#fff8e8;--ink:#293847;--sub:#5d6b77;--line:#d9dfd5;--yellow:#ffcf56;--yellow2:#f5b82e;--red:#c8483b;--green:#2f8f5b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px;display:grid;gap:14px}
h1{font-size:24px;margin:4px 0 0}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:stretch}
.big{width:100%;min-height:200px;border-radius:28px;border:4px solid var(--ink);background:var(--yellow);box-shadow:0 7px 0 var(--yellow2);font-family:inherit;font-weight:800;font-size:34px;color:var(--ink);touch-action:manipulation}
.big small{display:block;font-size:18px;font-weight:700;margin-top:6px}
.big.on{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 7px 0 #8f2f25}
.big:active{transform:translateY(4px)}
.text{font-size:30px;line-height:1.6;min-height:200px;padding:14px 18px;border:2px dashed var(--line);border-radius:18px;white-space:pre-wrap;word-break:break-all}
.text .interim{color:#9aa6ae}
.state{font-size:18px;color:var(--sub);margin-top:8px}
.state b{color:var(--green)}.state .ng{color:var(--red);font-weight:700}
h2{font-size:17px;margin:0 0 10px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font-family:inherit;font-weight:700;font-size:17px;padding:12px 18px;border-radius:12px;border:2px solid var(--ink);background:#fff}
.btn:disabled{opacity:.4}
audio{width:100%;margin-top:10px}
.log{font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;background:#101512;color:#d8f0e4;padding:12px;border-radius:12px;max-height:280px;overflow:auto}
.note{font-size:14px;color:var(--sub);line-height:1.7;margin:0}
@media (max-width:700px){.main{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <h1>こえで もじ テスト（ふたりでふりかえり）</h1>

  <div class="card main">
    <div>
      <button class="big" id="talk">🎤 おして はなす<small>もういちど おすと おわり</small></button>
      <p class="state" id="state">まだ はじめていません</p>
    </div>
    <div class="text" id="out"><span class="interim">ここに、はなした ことばが でます</span></div>
  </div>

  <div class="card">
    <h2>② ろくおんの テスト（①が うごかないときの ための しらべ）</h2>
    <div class="row">
      <button class="btn" id="recStart">ろくおん はじめ</button>
      <button class="btn" id="recStop" disabled>ろくおん おわり</button>
    </div>
    <audio id="player" controls></audio>
    <p class="note" id="recInfo"></p>
  </div>

  <div class="card">
    <h2>ログ（ここを しゃしんか スクリーンショットで おくってください）</h2>
    <div class="log" id="log"></div>
    <p class="note">このページは テスト用です。こえや もじは どこにも おくっていません（この画面の中だけ）。</p>
  </div>
</main>
<script>
'use strict';
var $ = function (id) { return document.getElementById(id); };
function log(m) { var t = new Date().toLocaleTimeString('ja-JP'); $('log').textContent += t + '  ' + m + '\n'; $('log').scrollTop = $('log').scrollHeight; }
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
log('page=github-mictest v1  url=' + location.host);
log('secure=' + window.isSecureContext + '  iframe=' + (window.self !== window.top));
log('SpeechRecognition=' + !!SR + '  getUserMedia=' + !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) + '  MediaRecorder=' + (typeof MediaRecorder !== 'undefined'));
log(navigator.userAgent);
if (navigator.permissions && navigator.permissions.query) {
  navigator.permissions.query({ name: 'microphone' }).then(function (p) { log('microphone permission=' + p.state); }).catch(function () { log('microphone permission=判定不可'); });
}

// ① ボタンで その場で 文字にする
var rec = null, on = false, finalText = '', gotResult = false;
function paint(interim) {
  var o = $('out'); o.replaceChildren();
  if (!finalText && !interim) { var s = document.createElement('span'); s.className = 'interim'; s.textContent = on ? 'きいています…' : 'ここに、はなした ことばが でます'; o.append(s); return; }
  o.append(document.createTextNode(finalText));
  if (interim) { var i = document.createElement('span'); i.className = 'interim'; i.textContent = interim; o.append(i); }
}
function setOn(v) {
  on = v;
  $('talk').classList.toggle('on', v);
  $('talk').firstChild.textContent = v ? '⏹ おわる' : '🎤 おして はなす';
  $('talk').querySelector('small').textContent = v ? 'はなしおわったら おしてね' : 'もういちど おすと おわり';
}
function startRec() {
  rec = new SR();
  rec.lang = 'ja-JP'; rec.interimResults = true; rec.continuous = true;
  rec.onstart = function () { log('音声認識: 開始'); $('state').innerHTML = '<b>きいています。はなしてね。</b>'; };
  rec.onaudiostart = function () { log('音声認識: 音の入力が始まった'); };
  rec.onspeechstart = function () { log('音声認識: 声を検出'); };
  rec.onresult = function (e) {
    gotResult = true;
    var interim = '';
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var t = e.results[i][0].transcript;
      if (e.results[i].isFinal) { finalText += t; log('音声認識: 確定 ' + t); } else interim += t;
    }
    paint(interim);
  };
  rec.onerror = function (e) {
    log('音声認識: ERROR ' + e.error + (e.message ? ' ' + e.message : ''));
    $('state').innerHTML = '<span class="ng">うごきませんでした（' + e.error + '）</span>';
    if (e.error === 'not-allowed' || e.error === 'service-not-allowed' || e.error === 'audio-capture') { setOn(false); }
  };
  rec.onend = function () {
    log('音声認識: 終了');
    // iPadは しばらく だまると 自動で とまるので、ボタンが ON の あいだは つづける
    if (on) { try { startRec(); log('音声認識: つづけて再開'); } catch (err) { log('再開失敗 ' + err.name); setOn(false); } }
    else { $('state').innerHTML = gotResult ? '<b>おわりました。もじに なりました。</b>' : 'おわりました（もじは でませんでした）'; paint(''); }
  };
  rec.start();
}
$('talk').addEventListener('click', function () {
  if (!SR) { log('音声認識: このブラウザには機能がありません'); $('state').innerHTML = '<span class="ng">このブラウザでは つかえません</span>'; return; }
  if (on) { setOn(false); try { rec.stop(); } catch (e) {} return; }
  finalText = ''; gotResult = false; setOn(true); paint('');
  try { startRec(); } catch (err) { log('音声認識: start失敗 ' + err.name + ' ' + err.message); setOn(false); }
});

// ② 録音（原因を しらべる ため）
var stream = null, mr = null, chunks = [];
function pickMime() {
  var list = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/aac'];
  for (var i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
$('recStart').onclick = async function () {
  try {
    log('録音: マイク取得を要求');
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    log('録音: マイク取得 OK');
    var mime = pickMime();
    mr = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
    log('録音: 形式=' + (mr.mimeType || '不明'));
    chunks = [];
    mr.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = function () {
      var type = mr.mimeType || 'audio/mp4', blob = new Blob(chunks, { type: type });
      $('player').src = URL.createObjectURL(blob);
      $('recInfo').textContent = 'ろくおん できました（' + type + '・' + blob.size + ' バイト）';
      log('録音: 完了 type=' + type + ' bytes=' + blob.size);
      stream.getTracks().forEach(function (t) { t.stop(); });
    };
    mr.start();
    $('recStart').disabled = true; $('recStop').disabled = false;
  } catch (err) {
    log('録音: ERROR ' + err.name + ': ' + err.message);
    $('recInfo').textContent = 'うごきませんでした（' + err.name + '）';
  }
};
$('recStop').onclick = function () { if (mr && mr.state !== 'inactive') mr.stop(); $('recStart').disabled = false; $('recStop').disabled = true; };
</script>
</body>
</html>
